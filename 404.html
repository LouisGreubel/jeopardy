<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07064f">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Page not found — Jeopardy! Random Game</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      display: grid;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      place-items: center;
      padding: 1rem;
      background: #05043d;
      color: #fff;
    }

    main {
      width: min(94vw, 34rem);
      padding: clamp(1.4rem, 5vw, 2.5rem);
      border: 0.14rem solid #2929ff;
      border-radius: 1rem;
      background: #08075a;
      text-align: center;
      box-shadow: 0 1rem 3rem rgb(0 0 0 / 0.35);
    }

    .kicker {
      margin: 0 0 0.35rem;
      color: #ffca24;
      font-size: 0.78rem;
      font-weight: 850;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 { margin: 0; }

    p {
      color: #c8c9e8;
      line-height: 1.55;
    }

    a {
      display: inline-grid;
      min-height: 3rem;
      margin-top: 0.75rem;
      place-items: center;
      padding: 0.75rem 1.1rem;
      border-radius: 0.6rem;
      background: #36b86a;
      color: #071d10;
      font-weight: 850;
      text-decoration: none;
    }

    a:focus-visible {
      outline: 0.18rem solid #fff;
      outline-offset: 0.16rem;
    }
  </style>
</head>
<body>
  <main>
    <p class="kicker">404</p>
    <h1>What is, "That page could not be found"?</h1>
    <p>The requested address does not exist. Return to the game to generate or continue your current board.</p>
    <a id="home-link" href="./">Return to the game</a>
  </main>
  <script>
    const homeLink = document.querySelector("#home-link");
    if (location.hostname.endsWith("github.io")) {
      homeLink.href = "/jeopardy/";
    }
  </script>
</body>
</html>
